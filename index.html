<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <h1 id="title"></h1>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="board"></div>
  <button id="share">Copy result</button>
  <div id="kb"></div>

  <button id="fb-open">Send feedback :D</button>

  <dialog id="fb">
    <form id="fb-form">
      <label for="fb-text">Suggest a feature or report a bug:</label>
      <textarea id="fb-text" name="message" rows="5" required></textarea>
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      <p id="fb-status" role="status"></p>
      <div class="fb-actions">
        <button type="button" id="fb-cancel">Cancel</button>
        <button type="submit" id="fb-send">Send</button>
      </div>
    </form>
  </dialog>

  <!-- Order matters: config and words first, then the game, then feedback -->
  <script src="js/config.js"></script>
  <script src="js/words.js"></script>
  <script src="js/game.js"></script>
  <script src="js/feedback.js"></script>
</body>

</html>
