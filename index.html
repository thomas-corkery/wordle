<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #000000;
      --tile: #ffffff;
      --line: #c0c3c6;
      --key: #c0c3c6;
      --hit: #00bb00;
      --near: #ffbb00;
      --miss: #c0c3c6;
      --onfill: #ffffff;
    }

    /* Dark mode colours*/
    @media (prefers-color-scheme:dark) {
      :root {
        --bg: #000000;
        --ink: #ffffff;
        --tile: #000000;
        --line: #3a3b3c;
        --key: #707274;
        --miss: #3a3b3c;
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 16px;
      gap: 10px
    }

    h1 {
      margin: 4px 0 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -.02em
    }

    #sub {
      margin: 0;
      font-size: .9rem;
      opacity: .7
    }

    #msg {
      min-height: 1.4em;
      font-weight: 500;
      text-align: center
    }

    #board {
      display: grid;
      gap: 6px
    }

    .row {
      display: grid;
      gap: 6px
    }

    .t {
      width: clamp(44px, 13vw, 60px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      background: var(--tile);
      border: 2px solid var(--line);
      font-size: 1.7rem;
      font-weight: 800;
      text-transform: uppercase
    }

    .t.f {
      border-color: var(--ink)
    }

    .t.hit,
    .t.near,
    .t.miss {
      color: var(--onfill);
      border-color: transparent
    }

    .hit {
      background: var(--hit)
    }

    .near {
      background: var(--near)
    }

    .miss {
      background: var(--miss)
    }

    .row.shake {
      animation: sh .35s
    }

    @keyframes sh {
      25% {
        transform: translateX(-6px)
      }

      75% {
        transform: translateX(6px)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .row.shake {
        animation: none
      }
    }

    #kb {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      margin-top: auto
    }

    .kr {
      display: flex;
      gap: 5px;
      justify-content: center
    }

    .k {
      flex: 1;
      max-width: 44px;
      height: 52px;
      border: 0;
      border-radius: 6px;
      background: var(--key);
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer
    }

    .k.w {
      max-width: 66px;
      font-size: .75rem
    }

    .k:focus-visible,
    #share:focus-visible {
      outline: 3px solid var(--near);
      outline-offset: 2px
    }

    .k.hit,
    .k.near,
    .k.miss {
      color: var(--onfill)
    }

    #share {
      display: none;
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: var(--hit);
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer
    }
  </style>
</head>

<body>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="board"></div>
  <button id="share">Copy result</button>
  <div id="kb"></div>

  <script>
    /* ============ CONFIGUATION =============== */
    const CONFIG = {
      title: "Worlde",         // shown at the top of the page
      startDate: "2026-11-11", // day 1 of the game (YYYY-MM-DD)
      maxGuesses: 6,
      wordLength: 5, // Currently accepts any five letter combination
      allowAnyGuess: true,
      // Example words. Game goes through them in order, one per day, then loops.
      words: [
        "crane", "pilot", "water", "lemon", "ghost", "river", "tiger", "bacon", "chair", "dream",
        "flame", "grape", "happy", "juice", "knife", "lucky", "mango", "night", "ocean", "piano",
        "queen", "robot", "smile", "table", "uncle", "vivid", "waltz", "young", "zebra", "brave",
        "candy", "dance", "eagle", "fresh", "giant", "honey", "ivory", "jolly", "kayak", "light"
      ]
    };
    /* ========================================= */

    const L = CONFIG.wordLength, N = CONFIG.maxGuesses;
    const words = CONFIG.words.map(w => w.toLowerCase()).filter(w => w.length === L);
    const [y, m, d] = CONFIG.startDate.split("-").map(Number);
    const today = new Date();
    const dayNum = Math.max(0, Math.floor((Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) - Date.UTC(y, m - 1, d)) / 864e5));
    const answer = words[dayNum % words.length];
    const KEY = "wordgame-" + dayNum;

    document.title = CONFIG.title;
    document.getElementById("title").textContent = CONFIG.title;
    document.getElementById("sub").textContent = "#" + (dayNum + 1);

    let guesses = [], current = "", over = false;
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) guesses = s; } catch (e) { }

    const board = document.getElementById("board"), msg = document.getElementById("msg");
    const rows = [];
    for (let i = 0; i < N; i++) {
      const r = document.createElement("div");
      r.className = "row"; r.style.gridTemplateColumns = "repeat(" + L + ",auto)";
      for (let j = 0; j < L; j++) { const t = document.createElement("div"); t.className = "t"; r.appendChild(t); }
      board.appendChild(r); rows.push(r);
    }

    function score(g) {
      const res = Array(L).fill("miss"), left = {};
      for (let i = 0; i < L; i++) {
        if (g[i] === answer[i]) res[i] = "hit"; else left[answer[i]] = (left[answer[i]] || 0) + 1;
      }
      for (let i = 0; i < L; i++) {
        if (res[i] !== "hit" && left[g[i]] > 0) { res[i] = "near"; left[g[i]]--; }
      }
      return res;
    }

    const keys = {};
    const layout = ["qwertyuiop", "asdfghjkl", "+zxcvbnm-"];
    const kb = document.getElementById("kb");
    layout.forEach(row => {
      const kr = document.createElement("div"); kr.className = "kr";
      [...row].forEach(c => {
        const b = document.createElement("button"); b.className = "k";
        if (c === "+") { b.textContent = "Enter"; b.classList.add("w"); b.onclick = () => press("Enter"); }
        else if (c === "-") { b.textContent = "Del"; b.classList.add("w"); b.onclick = () => press("Backspace"); }
        else { b.textContent = c; keys[c] = b; b.onclick = () => press(c); }
        kr.appendChild(b);
      });
      kb.appendChild(kr);
    });

    const rank = { miss: 1, near: 2, hit: 3 };
    function paintKey(c, s) {
      const b = keys[c]; if (!b) return;
      const cur = ["miss", "near", "hit"].find(x => b.classList.contains(x));
      if (cur && rank[cur] >= rank[s]) return;
      b.classList.remove("miss", "near", "hit"); b.classList.add(s);
    }

    function draw() {
      rows.forEach((r, i) => {
        const t = r.children;
        for (let j = 0; j < L; j++) {
          t[j].className = "t"; t[j].textContent = "";
          if (i < guesses.length) {
            t[j].textContent = guesses[i][j]; t[j].classList.add(score(guesses[i])[j]);
          } else if (i === guesses.length && !over) {
            t[j].textContent = current[j] || ""; if (current[j]) t[j].classList.add("f");
          }
        }
      });
    }

    function finish() {
      over = true;
      const won = guesses[guesses.length - 1] === answer;
      msg.textContent = won ? "Solved in " + guesses.length + "/" + N + "!" : "The word was " + answer.toUpperCase() + ".";
      document.getElementById("share").style.display = "block";
    }

    function press(k) {
      if (over) return;
      if (k === "Enter") {
        if (current.length < L) return flash("Not enough letters");
        if (!CONFIG.allowAnyGuess && !words.includes(current)) return flash("Not in our word list");
        guesses.push(current); current = "";
        try { localStorage.setItem(KEY, JSON.stringify(guesses)); } catch (e) { }
        const last = guesses[guesses.length - 1], sc = score(last);
        [...last].forEach((c, i) => paintKey(c, sc[i]));
        if (last === answer || guesses.length >= N) finish(); else msg.textContent = "";
      } else if (k === "Backspace") { current = current.slice(0, -1); }
      else if (/^[a-z]$/i.test(k) && current.length < L) { current += k.toLowerCase(); }
      draw();
    }

    function flash(t) {
      msg.textContent = t;
      const r = rows[guesses.length]; r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake");
    }

    document.addEventListener("keydown", e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "Enter" && document.activeElement && document.activeElement.tagName === "BUTTON") return;
      press(e.key);
    });

    document.getElementById("share").onclick = () => {
      const em = { hit: "🟩", near: "🟨", miss: "⬛" };
      const won = guesses[guesses.length - 1] === answer;
      const text = CONFIG.title + " No. " + (dayNum + 1) + " " + (won ? guesses.length : "X") + "/" + N + "\n\n" +
        guesses.map(g => score(g).map(s => em[s]).join("")).join("\n");
      const done = () => { msg.textContent = "Result copied. Paste it in your group chat!"; };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => { msg.textContent = text; });
      else msg.textContent = text;
    };

    guesses.forEach(g => { const sc = score(g);[...g].forEach((c, i) => paintKey(c, sc[i])); });
    if (guesses.length && (guesses[guesses.length - 1] === answer || guesses.length >= N)) finish();
    draw();
  </script>
</body>

</html>
